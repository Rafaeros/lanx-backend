server:
  address: ${SERVER_ADDRESS:0.0.0.0} # 0.0.0.0 = aceita conexões de qualquer IP da rede
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: lanx-backend

  config:
    import:
      optional:file:.env[.properties]

  web:
    error:
      include-stacktrace: never
      include-message: never

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lanx}
    username: ${DB_USER:lanx}
    password: ${DB_PASSWORD:lanx}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:lanx}
    password: ${RABBITMQ_PASSWORD:lanx}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto # Spring da ack se o metodo terminar sem exceção
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          "[hibernate.jdbc.time_zone]": UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: auth, cadastros, compras
    baseline-on-migrate: true

  mvc:
    problemdetails:
      enabled: true

  jackson:
    default-property-inclusion: non_null
    time-zone: America/Sao_Paulo

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE:20MB}
      max-request-size: ${UPLOAD_MAX_REQUEST:25MB}

app:
  bootstrap:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:} # vazio = não cria o administrador

  security:
    token:
      secret: ${JWT_SECRET} # Base64, mínimo 32 bytes: openssl rand -base64 32
      issuer: lanx-backend
      expiration: 8h
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,http://localhost:8090,http://localhost,http://127.0.0.1:5173}

  cg-api-url: ${CG_API_URL:http://localhost:8000/api/v1}
  # a carteira consolida 3 relatórios do ERP: um ano leva ~1,5 min
  cg-carteira-timeout: ${CG_CARTEIRA_TIMEOUT:5m}

  storage:
    tipo: ${ANEXOS_STORAGE_TIPO:local}
    base-dir: ${ANEXOS_DIRETORIO:./data/anexos}

  rabbitmq:
    exchange: lanx.events
    queues:
      notificacoes-nao-conformidade: lanx.notificacoes.nao-conformidade-criada
    routing-keys:
      nao-conformidade-criada: teste-inspecao.nao-conformidade.criada

  notificacoes:
    nao-conformidade-criada:
      departmentos: [Qualidade, Teste]

seeder:
  paises:
    path: classpath:db/seeders/paises.csv
