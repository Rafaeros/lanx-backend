app:
  bootstrap:
    admin:
      password: "" # testes não criam o administrador sozinhos
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS auth\;CREATE SCHEMA IF NOT EXISTS cadastros\;CREATE SCHEMA IF NOT EXISTS compras\;CREATE SCHEMA IF NOT EXISTS operacoes
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop # O Hibernate cria as tabelas do zero só para o teste e depois apaga
  flyway:
    enabled: false # Desliga o Flyway nos testes, deixando o Hibernate gerenciar o banco H2
