info:
  name: Consultar
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/comercial/relatorios/carteira?dataInicio=2026-10-01&dataFim=2026-10-31"
  params:
    - name: dataInicio
      value: "2026-10-01"
      type: query
    - name: dataFim
      value: "2026-10-31"
      type: query
    - name: atualizar
      value: "true"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Carteira de pedidos (ERP via cg-scraper)**

  - **Rota:** `GET /comercial/relatorios/carteira`
  - **Segurança:** token + `comercial.carteira:read`
  - **Query:** `dataInicio`, `dataFim` (ISO; sem datas = mês corrente), `atualizar=true` (ignora o cache de 10 min e consulta o ERP de novo).
  - **Demora:** o cg-scraper cruza 3 relatórios do ERP na hora: um mês ~20 s, um ano ~1,5 min. Repetir o mesmo período em até 10 min responde na hora.
  - **Resposta:** `resumo` (itens, valorTotal, atrasados, comMaterialPendente), `consultadoEm` e `itens` ordenados pela previsão, cada um com `atrasado` e `materiaisPendentes`.
  - **Erros:** `400` período invertido · `401` sem token · `403` sem a permissão · `503` cg-scraper fora do ar ou sem resposta
