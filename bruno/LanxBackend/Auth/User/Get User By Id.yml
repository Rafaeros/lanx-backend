info:
  name: Get User By Id
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/auth/users/{{userId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Buscar usuário por id**

  - **Rota:** `GET /auth/users/{id}`
  - **Segurança:** token + `administracao.usuarios:read`
  - **Variável:** `userId` (ambiente)
  - **Resposta 200:** `permissions` é o resultado final (união das permissões das roles).

  ```json
  {
    "status": 200,
    "message": "Usuário carregado",
    "data": {
      "id": "01a120a9-f91c-7e10-a2a5-d5740ad1f032",
      "username": "joao.silva",
      "active": true,
      "roles": [{ "id": "...", "name": "GERENTE_CADASTROS" }],
      "permissions": ["cadastros.materiais:read"]
    }
  }
  ```

  - **Erros:** `401` sem token · `403` sem a permissão · `404` usuário não encontrado
