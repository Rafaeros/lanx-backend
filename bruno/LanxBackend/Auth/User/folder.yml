docs:
  content: |-
    ### **Auth / Users**

    | Rota | Permissão exigida |
    |---|---|
    | `GET /auth/users/{id}` | `administracao.usuarios:read` |
    | `POST /auth/users` | `administracao.usuarios:create` |
    | `PUT /auth/users/{id}` | `administracao.usuarios:update` |

    O usuário não tem permissões próprias: elas vêm só das roles.
  type: text/markdown
