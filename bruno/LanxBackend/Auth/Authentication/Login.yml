info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "{{adminUsername}}",
        "password": "{{adminPassword}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### **Auth / Authentication**

  **🔹 Login**

  - **Rota:** `POST /auth/login`
  - **Segurança:** Pública (não exige token)
  - **Body (JSON):**

  ```json
  {
    "username": "admin",
    "password": "Admin12345"
  }
  ```

  - **Resposta 200:** copie o `accessToken` para a variável `accessToken` do ambiente (aba Secrets). Todas as outras rotas usam `Authorization: Bearer {{accessToken}}`.

  ```json
  {
    "status": 200,
    "message": "Login realizado com sucesso",
    "data": { "accessToken": "eyJ...", "tokenType": "Bearer", "expiresAt": "2026-10-14T20:00:00Z" }
  }
  ```

  - **Erros:** `400` campo vazio · `401` usuário ou senha inválidos · `403` usuário inativo
  - **Observação:** o token carrega só a identidade. As permissões são resolvidas no servidor a cada requisição, então mudar uma role vale na hora, sem novo login.
