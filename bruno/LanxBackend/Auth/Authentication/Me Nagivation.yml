info:
  name: Me Navigation
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/auth/me/navigation"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### **Auth / Me (Navegação pessoal)**

  **🔹 Árvore de navegação**

  - **Rota:** `GET /auth/me/navigation`
  - **Segurança:** exige token. Não exige permissão específica (qualquer usuário autenticado).
  - **Para que serve:** o front chama logo após o login para desenhar menus e esconder botões. Só voltam as funcionalidades em que o usuário tem ao menos uma ação.
  - **Resposta 200:**

  ```json
  {
    "status": 200,
    "message": "Navegação carregada",
    "data": [
      {
        "key": "cadastros",
        "label": "Cadastros",
        "actions": [],
        "children": [
          { "key": "cadastros.materiais", "label": "Materiais", "actions": ["read", "create"], "children": [] }
        ]
      }
    ]
  }
  ```

  - **Erros:** `401` sem token ou token inválido/expirado
