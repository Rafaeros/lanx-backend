info:
  name: Get All Roles
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/auth/roles"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Listar roles**

  - **Rota:** `GET /auth/roles`
  - **Segurança:** token + `administracao.permissoes:read`
  - **Resposta 200:** lista ordenada por nome. `permissions` são os códigos concedidos à role.

  ```json
  {
    "status": 200,
    "message": "Roles carregadas",
    "data": [
      {
        "id": "01a120a9-f91c-7e10-a2a5-d5740ad1f032",
        "name": "ADMIN",
        "description": "Acesso total ao sistema",
        "permissions": ["administracao.usuarios:read", "cadastros.materiais:read"]
      }
    ]
  }
  ```

  - **Erros:** `401` sem token ou token expirado · `403` sem a permissão
