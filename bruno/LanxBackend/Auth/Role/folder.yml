docs:
  content: |-
    ### **Auth / Roles (Perfis)**

    Uma role é um conjunto de permissões (`feature:action`). O usuário recebe a união das permissões de todas as suas roles.

    | Rota | Permissão exigida |
    |---|---|
    | `GET /auth/roles` | `administracao.permissoes:read` |
    | `GET /auth/roles/{id}` | `administracao.permissoes:read` |
    | `POST /auth/roles` | `administracao.permissoes:create` |
    | `PUT /auth/roles/{id}` | `administracao.permissoes:update` |

    A role `ADMIN` é criada e mantida na subida da aplicação, sempre com todas as permissões do catálogo.
  type: text/markdown
