docs:
  content: |-
    ### **4. Auth / Roles (Perfis)**

    As rotas de Roles exigem Token + Permissão `administracao.permissoes`.

    **🔹 Listar Roles**

    - **Rota:** `GET /auth/roles`

    **🔹 Buscar Role Específica**

    - **Rota:** `GET /auth/roles/{id}`

    **🔹 Criar Role**

    - **Rota:** `POST /auth/roles`
    - **Body (JSON):** *(Exemplo de como o payload de permissão deve ser)*

    ```
    json
    ```

    <span>{</span>

    <span>"name": "Gerente de Cadastros",</span>

    <span>"permissions": {</span>

    <span>"cadastros.unidade-medida": {</span>

    <span>"crud": \["READ", "CREATE", "UPDATE", "DELETE"\]</span>

    <span>    }</span>

    <span>  }</span>

    <span>}</span>

    **🔹 Atualizar Role**

    - **Rota:** `PUT /auth/roles/{id}`
    - **Body (JSON):** *(Mesmo formato da criação)*
  type: text/markdown
