info:
  name: Update Role
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/auth/roles/{{roleId}}"
  body:
    type: json
    data: |-
      {
        "name": "GERENTE_CADASTROS",
        "description": "Gerencia unidades de medida e materiais",
        "permissions": [
          "cadastros.unidade-medida:read",
          "cadastros.materiais:read",
          "cadastros.materiais:create"
        ]
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Atualizar role**

  - **Rota:** `PUT /auth/roles/{id}`
  - **Segurança:** token + `administracao.permissoes:update`
  - **Variável:** `roleId` (ambiente)
  - **Body:** mesmo da criação. As permissões enviadas **substituem** as atuais (mande a lista completa).
  - **Efeito imediato:** quem tem essa role passa a ter as novas permissões na próxima requisição, sem novo login.
  - **Resposta 200:** `{ "message": "Role atualizada" }`
  - **Erros:** `400` validação ou permissão desconhecida · `401` sem token · `403` sem a permissão · `404` role não encontrada · `409` nome já em uso
