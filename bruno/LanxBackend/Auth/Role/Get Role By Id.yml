info:
  name: Get Role By Id
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/auth/roles/{{roleId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Buscar role por id**

  - **Rota:** `GET /auth/roles/{id}`
  - **Segurança:** token + `administracao.permissoes:read`
  - **Variável:** `roleId` (ambiente)
  - **Resposta 200:** mesmo formato de um item de `GET /auth/roles`.
  - **Erros:** `401` sem token ou token expirado · `403` sem a permissão · `404` role não encontrada
