info:
  name: Get All Features
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/auth/features"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  ### **Auth / Authorization (Catálogo)**

  **🔹 Catálogo de funcionalidades e permissões**

  - **Rota:** `GET /auth/features`
  - **Segurança:** token + `administracao.permissoes:read`
  - **Para que serve:** alimenta os checkboxes da tela de perfis. Cada permissão tem um `code` (`feature:action`), que é exatamente o valor enviado em `permissions` ao criar ou editar uma role.
  - **Resposta 200:**

  ```json
  {
    "status": 200,
    "message": "Catálogo de funcionalidades",
    "data": [
      {
        "key": "cadastros",
        "label": "Cadastros",
        "permissions": [
          { "code": "cadastros:read", "action": "read" },
          { "code": "cadastros:create", "action": "create" }
        ],
        "children": [
          { "key": "cadastros.materiais", "label": "Materiais", "permissions": [ ... ], "children": [] }
        ]
      }
    ]
  }
  ```

  - **Erros:** `401` sem token · `403` sem a permissão
