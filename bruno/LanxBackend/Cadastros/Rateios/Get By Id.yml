info:
  name: Get By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/rateios/{{rateioId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Buscar rateio por id**

  - **Rota:** `GET /rateios/{id}`
  - **Segurança:** token + `cadastros.rateios:read`
  - **Variável:** `rateioId` (ambiente)
  - **Resposta 200:** o rateio (mesmo formato do Create).
  - **Erros:** `401` sem token · `403` sem a permissão · `404` rateio não encontrado
