info:
  name: Get All
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/clientes?busca=&page=0&size=20"
  params:
    - name: busca
      value: ""
      type: query
      disabled: true
    - name: page
      value: "0"
      type: query
    - name: size
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Listar clientes (paginado)**

  - **Rota:** `GET /clientes`
  - **Segurança:** token + `cadastros.clientes:read`
  - **Query (todas opcionais):** `busca` (nome ou dígitos do CNPJ), `page` (começa em 0), `size` (padrão 20), `sort` (padrão `nome`).
  - **Resposta 200:** `data` é uma página de clientes (mesmo formato do Create).
  - **Erros:** `401` sem token · `403` sem a permissão
