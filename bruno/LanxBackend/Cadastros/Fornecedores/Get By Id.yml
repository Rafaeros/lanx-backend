info:
  name: Get By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/fornecedores/{{fornecedorId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Buscar fornecedor por id**

  - **Rota:** `GET /fornecedores/{id}`
  - **Segurança:** token + `cadastros.fornecedores:read`
  - **Variável:** `fornecedorId` (ambiente)
  - **Resposta 200:** o fornecedor (mesmo formato do Create).
  - **Erros:** `401` sem token · `403` sem a permissão · `404` fornecedor não encontrado
