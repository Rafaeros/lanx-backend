info:
  name: Get By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/compradores/{{compradorId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Buscar comprador por id**

  - **Rota:** `GET /compradores/{id}`
  - **Segurança:** token + `cadastros.compradores:read`
  - **Variável:** `compradorId` (ambiente)
  - **Resposta 200:** o comprador (mesmo formato do Create).
  - **Erros:** `401` sem token · `403` sem a permissão · `404` comprador não encontrado
