info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/unidade-medida"
  body:
    type: json
    data: |-
      {
        "nome": "Quilo",
        "sigla": "Kg"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Criar unidade de medida**

  - **Rota:** `POST /unidade-medida`
  - **Segurança:** token + `cadastros.unidade-medida:create`
  - **Body:** `nome` e `sigla` obrigatórios (sigla única).
  - **Resposta 201:** `{ "message": "Unidade de medida criada!", "data": { "id": "..." } }` (o status HTTP também é 201)
  - **Erros:** `400` campo vazio · `401` sem token · `403` sem a permissão · `409` sigla já existe
