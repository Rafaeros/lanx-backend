info:
  name: Update
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/unidade-medida/{{unidadeMedidaId}}"
  body:
    type: json
    data: |-
      {
        "nome": "Quilograma",
        "sigla": "KG"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Atualizar unidade de medida**

  - **Rota:** `PUT /unidade-medida/{id}`
  - **Segurança:** token + `cadastros.unidade-medida:update`
  - **Variável:** `unidadeMedidaId` (ambiente)
  - **Body:** `nome` e `sigla`. Campo vazio ou ausente mantém o valor atual.
  - **Resposta 200:** `{ "message": "Unidade de medida atualizada com sucesso!" }`
  - **Erros:** `401` sem token · `403` sem a permissão. `404` unidade não encontrada · `409` sigla já usada por outra unidade.
