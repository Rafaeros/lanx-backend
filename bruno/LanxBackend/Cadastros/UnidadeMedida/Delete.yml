info:
  name: Delete
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl}}/unidade-medida/{{unidadeMedidaId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Excluir unidade de medida**

  - **Rota:** `DELETE /unidade-medida/{id}`
  - **Segurança:** token + `cadastros.unidade-medida:delete`
  - **Variável:** `unidadeMedidaId` (ambiente)
  - **Efeito:** exclusão lógica (a unidade deixa de aparecer nas buscas).
  - **Resposta 200:** `{ "message": "Unidade de medida excluída com sucesso!" }`
  - **Erros:** `401` sem token · `403` sem a permissão. `404` não encontrada · `409` unidade em uso por materiais (exclua ou mude os materiais antes).
