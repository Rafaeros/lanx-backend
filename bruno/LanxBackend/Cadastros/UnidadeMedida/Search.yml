info:
  name: Search
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/unidade-medida?busca=&page=0&size=20"
  params:
    - name: busca
      value: ""
      type: query
    - name: page
      value: "0"
      type: query
    - name: size
      value: "20"
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Buscar unidades de medida (paginado)**

  - **Rota:** `GET /unidade-medida`
  - **Segurança:** token + `cadastros.unidade-medida:read`
  - **Query (opcionais):** `busca` (texto no nome ou sigla), `page` (começa em 0, padrão 0), `size` (padrão 20).
  - **Resposta 200:** página com itens `{ "id", "nome", "sigla" }`.
  - **Erros:** `401` sem token · `403` sem a permissão
