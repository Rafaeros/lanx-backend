info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/materiais"
  body:
    type: json
    data: |-
      {
        "codigo": "CNFAT04CZ",
        "descricao": "CONECTOR 4 VIAS",
        "unidadeMedidaId": "{{unidadeMedidaId}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Cadastrar material**

  - **Rota:** `POST /materiais`
  - **Segurança:** token + `cadastros.materiais:create`
  - **Variável:** `unidadeMedidaId` (ambiente)
  - **Body:** `codigo` (único), `descricao` e `unidadeMedidaId` são obrigatórios.
  - **Resposta 201:**

  ```json
  {
    "status": 201,
    "message": "Material cadastrado com sucesso!",
    "data": {
      "id": "...",
      "codigo": "CNFAT04CZ",
      "descricao": "CONECTOR 4 VIAS",
      "unidadeMedida": { "id": "...", "nome": "Quilo", "sigla": "Kg" }
    }
  }
  ```

  - **Erros:** `400` campo obrigatório ausente · `401` sem token · `403` sem a permissão · `404` unidade de medida não encontrada · `409` código já cadastrado
