info:
  name: Get By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/materiais/{{materialId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Buscar material por id**

  - **Rota:** `GET /materiais/{id}`
  - **Segurança:** token + `cadastros.materiais:read`
  - **Variável:** `materialId` (ambiente)
  - **Resposta 200:** mesmo formato do Create.
  - **Erros:** `401` sem token · `403` sem a permissão · `404` não encontrado
