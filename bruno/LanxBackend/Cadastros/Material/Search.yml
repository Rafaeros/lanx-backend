info:
  name: Search
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/materiais?codigo=CNFAT04CZ&descricao=&page=0&size=20"
  params:
    - name: codigo
      value: CNFAT04CZ
      type: query
    - name: descricao
      value: ""
      type: query
      disabled: true
    - name: tipo
      value: MATERIA_PRIMA
      type: query
      disabled: true
    - name: page
      value: "0"
      type: query
    - name: size
      value: "20"
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Buscar materiais (paginado)**

  - **Rota:** `GET /materiais`
  - **Segurança:** token + `cadastros.materiais:read`
  - **Query (todas opcionais):** `codigo` (igual ao informado, sem diferenciar maiúsculas), `descricao` (contém o texto), `tipo` (`MATERIA_PRIMA` | `PRODUTO_ACABADO`; ausente = todos), `page` (começa em 0), `size` (padrão 20), `sort` (ex.: `codigo,asc`).
  - **Resposta 200:** `data` é uma página de materiais (mesmo formato do Create).
  - **Erros:** `401` sem token · `403` sem a permissão
