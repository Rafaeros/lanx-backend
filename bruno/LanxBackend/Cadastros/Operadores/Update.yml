info:
  name: Update
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/operadores/01a15e3f-8b42-74f5-a966-5dc0b6a6fc5b"
  body:
    type: json
    data: |-
      {
        "nome": "Rafael Cordeiro",
        "departamentoId": "01a15e35-d664-7694-ae9b-8b3eaaa8aaf7",
        "userId": "{{userId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Atualizar operador**

  - **Rota:** `PUT /operadores/{id}`
  - **Segurança:** token + `cadastros.operadores:update`
  - **Body:** `nome` obrigatório (máx. 100, único); `departamentoId` opcional; `userId` opcional — vincula o operador a um usuário do LANX (1 usuário = no máximo 1 operador; nulo deixa o operador sem usuário).
  - **Resposta 200:** `{ "id", "nome", "departamento": { "id", "nome" } | null, "usuario": { "id", "username" } | null }`
  - **Erros:** `400` campo inválido ou ausente · `401` sem token · `403` sem a permissão · `404` operador, departamento ou usuário não encontrados · `409` nome já usado ou usuário já vinculado a outro operador
