info:
  name: Get
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/engenharia/operacoes/desenhos/{{desenhoJobId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Detalhe do desenho**

  - **Rota:** `GET /engenharia/operacoes/desenhos/{id}`
  - **Segurança:** token + `engenharia.desenhos:read`
  - **Variável:** `desenhoJobId`
  - **Resposta 200:** status, opções, `pendencias` (do relatório de validação), `erro` e os `arquivos`
    (LISTA_CORTE, DESENHO_CLIENTE, RESULTADO_ZIP). Copie o `id` do RESULTADO_ZIP para `desenhoArquivoId`.
  - **Erros:** `404` desenho não encontrado
