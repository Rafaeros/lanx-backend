info:
  name: DownloadArquivo
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/engenharia/operacoes/desenhos/{{desenhoJobId}}/arquivos/{{desenhoArquivoId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Baixar arquivo do desenho**

  - **Rota:** `GET /engenharia/operacoes/desenhos/{id}/arquivos/{arquivoId}`
  - **Segurança:** token + `engenharia.desenhos:read`
  - **Variáveis:** `desenhoJobId`, `desenhoArquivoId`
  - **Resposta 200:** o arquivo com o nome original. O zip traz DXF/DWG/PDF/PNG e o `relatorio_validacao.md`.
  - **Erros:** `404` desenho ou arquivo não encontrado
