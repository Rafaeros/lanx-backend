info:
  name: List
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/engenharia/operacoes/desenhos?projeto=&status=&meus=false&page=0&size=20"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Histórico de desenhos**

  - **Rota:** `GET /engenharia/operacoes/desenhos`
  - **Segurança:** token + `engenharia.desenhos:read`
  - **Filtros (opcionais):** `projeto` (trecho do código), `status` (PENDENTE, PROCESSANDO, CONCLUIDO, ERRO),
    `meus=true` (só os seus pedidos), `page`, `size`
  - **Resposta 200:** mais recentes primeiro; cada item traz `qtdPendencias` e `temZip`.
