info:
  name: Get By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/producao/operacoes/ordens-de-producao/{{ordemDeProducaoId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Buscar ordem de produção**

  - **Rota:** `GET /producao/operacoes/ordens-de-producao/{id}`
  - **Segurança:** token + `producao.ordens-producao:read`
  - **Erros:** `401` sem token · `403` sem a permissão · `404` OP não encontrada
