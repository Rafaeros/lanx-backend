info:
  name: Update
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/producao/operacoes/ordens-de-producao/{{ordemDeProducaoId}}"
  body:
    type: json
    data: |-
      {
        "codigo": "OP-0001",
        "clienteId": "{{clienteId}}",
        "materialId": "{{materialId}}",
        "quantidade": 74,
        "previsao": "2026-11-10",
        "etapaAtual": "Corte"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Atualizar ordem de produção**

  - **Rota:** `PUT /producao/operacoes/ordens-de-producao/{id}`
  - **Segurança:** token + `producao.ordens-producao:update`
  - **Body:** o mesmo do Create (substitui todos os campos; `etapaAtual` nulo ou vazio limpa a etapa).
  - **Erros:** `400` campo inválido · `401` sem token · `403` sem a permissão · `404` OP, cliente ou material não encontrado · `409` código de outra OP
