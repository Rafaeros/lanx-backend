info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/producao/operacoes/ordens-de-producao"
  body:
    type: json
    data: |-
      {
        "codigo": "OP-0001",
        "clienteId": "{{clienteId}}",
        "materialId": "{{materialId}}",
        "quantidade": 74,
        "previsao": "2026-11-10",
        "etapaAtual": null
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **🔹 Cadastrar ordem de produção**

  - **Rota:** `POST /producao/operacoes/ordens-de-producao`
  - **Segurança:** token + `producao.ordens-producao:create`
  - **Body:** `codigo` (até 10, único entre as OPs ativas, sem diferenciar maiúsculas), `clienteId`, `materialId`, `quantidade` (> 0) e `previsao` (yyyy-MM-dd) obrigatórios; `etapaAtual` opcional.
  - **Resposta 201:** `data` com `id`, `codigo`, `cliente { id, nome }`, `material { id, codigo, descricao, unidadeMedida }`, `quantidade`, `previsao`, `etapaAtual`.
  - **Erros:** `400` campo inválido ou ausente · `401` sem token · `403` sem a permissão · `404` cliente ou material não encontrado · `409` código já usado
